    <div id="error-modal" class="modal-overlay">
        <div class="card modal-content">
            <div class="card-body">
                <div class="flex-row" style="color: var(--error); margin-bottom: 1rem; gap: 0.5rem;">
                    <span class="material-symbols-outlined" style="font-size: 2rem;">error</span>
                    <h3 style="margin: 0; font-size: 1.25rem;">Action Error</h3>
                </div>
                <p id="error-message" style="margin-bottom: 1.5rem; color: var(--text-muted);"></p>
                <div style="text-align: right;">
                    <button class="btn btn-secondary" onclick="closeErrorModal()">Dismiss</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // User Email Dropdown / Log Out Link
        document.addEventListener('DOMContentLoaded', () => {
          const toggleBtn = document.getElementById('user-menu-btn');
          const dropdownMenu = document.getElementById('user-dropdown-menu');
      
          // Toggle menu on button click
          toggleBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              dropdownMenu.classList.toggle('show');
              
              // Update ARIA state for accessibility
              const isExpanded = dropdownMenu.classList.contains('show');
              toggleBtn.setAttribute('aria-expanded', isExpanded);
          });
      
          // Close the menu if clicking outside of it
          window.addEventListener('click', (e) => {
              if (!e.target.closest('.dropdown')) {
                  if (dropdownMenu.classList.contains('show')) {
                      dropdownMenu.classList.remove('show');
                      toggleBtn.setAttribute('aria-expanded', 'false');
                  }
              }
          });
      });
      
      // Wait for the entire page (including CSS and fonts) to load
      window.addEventListener('load', function() {
        
        // Add `active` class to appropriate `nav-link`
        const page = document.title.replace('VBR - ', '');
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.textContent === page) {
                link.classList.add('active');
            }
        });
      
        // Remove the overlay from the DOM
        const overlay = document.getElementById('loading-overlay');
        overlay.style.opacity = '0';
        setTimeout(() => {
            overlay.style.display = 'none';
            document.body.classList.remove('loading'); // Restore scrolling
        }, 300); // 300ms matches the CSS transition time
      });
    </script>
