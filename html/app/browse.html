<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VBR - Browse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link href="style.css" rel="stylesheet"/>
</head>

<body>

    <!--#include virtual="/app/header.html" -->

    <main class="mpa-container">
        <div class="page-wrapper page-wrapper-full" style="display: flex; flex-direction: column; height: 100%;">
            
            <div class="excel-tabs top-tabs flex-between" id="excel-tabs" style="margin-bottom: 0;">
                <div class="flex-row" style="gap: 0;">
                    <button class="tab-btn active" data-table="participants">participants</button>
                    <button class="tab-btn" data-table="events">events</button>
                    <button class="tab-btn" data-table="samples">samples</button>
                    <button class="tab-btn" data-table="libraries">libraries</button>
                    <button class="tab-btn" data-table="analyses">analyses</button>
                    <button class="tab-btn" data-table="files">files</button>
                </div>
                
                <div class="flex-row" style="gap: 0;">
                    <button class="tab-btn" data-table="biosamples">biosamples</button>
                    <button class="tab-btn" data-table="sra">sra</button>
                </div>
            </div>
    
            <div class="workspace-layout ag-integrated-wrapper">
    
                <div class="ag-custom-toolbar flex-between">
                    
                    <div class="filter-wrapper">
                        <span class="material-symbols-outlined filter-icon">filter_list</span>
                        <input type="text" id="quick-filter-input" placeholder="Filter..." class="ag-custom-input" />
                    </div>
                    
                    <div class="flex-row" style="align-items: center; gap: 0.5rem;">
                        <div id="dynamic-action-bar" class="flex-row" style="gap: 0.5rem;"></div>
                        
                        <div class="vertical-divider"></div>
                        
                        <button id="refresh-btn" class="ag-icon-btn" title="Refresh Data">
                            <span class="material-symbols-outlined">refresh</span>
                        </button>
                    </div>
                </div>
            
                <div id="myGrid" style="flex-grow: 1; width: 100%;"></div>

                <div class="custom-grid-footer flex-between" style="padding: 0.75rem 1rem; border-top: 1px solid var(--border-color); background: var(--bg-surface); align-items: center; font-size: 0.85rem; color: var(--text-muted);">
                    
                    <div style="flex: 1; display: flex; gap: 1rem;">
                        <span id="stat-selected">0 Selected</span>
                        <span id="stat-filtered" style="display: none;">(Filtered from 0 total)</span>
                    </div>
                
                    <div style="flex: 1; text-align: center; font-weight: 600; color: var(--text-main);">
                        <span id="stat-total">Total: 0 rows</span>
                    </div>
                
                    <div style="flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 1rem;">
                        
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <label for="page-size-select">Page Size:</label>
                            <select id="page-size-select" class="ag-custom-input" style="padding: 0.2rem; width: auto;">
                                <option value="20">20</option>
                                <option value="50">50</option>
                                <option value="100" selected>100</option>
                                <option value="500">500</option>
                            </select>
                        </div>
                
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <button id="btn-prev-page" class="ag-icon-btn" style="padding: 0.2rem;"><span class="material-symbols-outlined">chevron_left</span></button>
                            <span id="stat-page-info">Page 1 of 1</span>
                            <button id="btn-next-page" class="ag-icon-btn" style="padding: 0.2rem;"><span class="material-symbols-outlined">chevron_right</span></button>
                        </div>
                
                    </div>
                </div>
                
            </div>
            
        </div>
    </main>

    <!--#include virtual="/app/footer.html" -->

    <div id="error-modal" class="modal-overlay">
        <div class="card modal-content">
            <div class="card-body">
                <div class="flex-row" style="color: var(--error); margin-bottom: 1rem; gap: 0.5rem;">
                    <span class="material-symbols-outlined" style="font-size: 2rem;">error</span>
                    <h3 style="margin: 0; font-size: 1.25rem;">Action Error</h3>
                </div>
                <p id="error-message" style="margin-bottom: 1.5rem; color: var(--text-muted);"></p>
                <div style="text-align: right;">
                    <button class="btn btn-secondary" onclick="closeErrorModal()">Dismiss</button>
                </div>
            </div>
        </div>
    </div>
  
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@35.3.1/dist/ag-grid-community.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabButtons = document.querySelectorAll('.tab-btn');
            const actionBar = document.getElementById('dynamic-action-bar');
            const searchInput = document.getElementById('quick-filter-input');
            
            let currentTable = "participants";
            let gridApi;
            
            // --- NEW: Toggle State & Helper ---
            let hideEmptyColumns = true; 
    
            function getEmptyColumns(data) {
                if (!data || data.length === 0) return [];
                const keys = Object.keys(data[0]);
                // Find columns where every row's value is null, undefined, or an empty string
                return keys.filter(key => 
                    data.every(row => row[key] === null || row[key] === undefined || row[key] === '')
                );
            }
    
            window.showErrorModal = msg => {
                document.getElementById('error-message').textContent = msg;
                document.getElementById('error-modal').classList.add('show');
            };
            window.closeErrorModal = () => document.getElementById('error-modal').classList.remove('show');
    
            const ACTION_CONFIG = {
                "biosamples": [{ id: "btn-assign-biosample", label: "Assign BioSample IDs", icon: "assignment", endpoint: "/api/biosamples/assign", payloadKey: "sample_name" }],
                "sra": [{ id: "btn-export-sra", label: "Export for SRA", icon: "ios_share", endpoint: "/api/sra/export", payloadKey: "file_path" }]
            };
    
            const gridOptions = {
                theme: agGrid.themeQuartz.withPart(agGrid.colorSchemeDarkBlue),
                pagination: true,
                paginationPageSize: 100,
                paginationPageSizeSelector: [20, 50, 100, 500, 1000, 5000],
                columnDefs: [],
                
                rowSelection: {
                    mode: 'multiRow',
                    headerCheckbox: true,
                    checkboxes: true,
                    enableClickSelection: true
                },
                
                selectionColumnDef: {
                    width: 50,
                    minWidth: 50,
                    maxWidth: 50,
                    pinned: 'left',
                    resizable: false,
                    suppressSizeToFit: true
                },
                
                defaultColDef: {
                    sortable: true,
                    filter: true,
                    resizable: true,
                    minWidth: 120,
                    tooltipValueGetter: (params) => params.value 
                },
                // --- UPDATED: Universally use hvp_id as the row identifier ---
                getRowId: params => {
                    if (!params.data) return undefined;
                    return params.data.hvp_id;
                }
            };
    
            const gridDiv = document.querySelector('#myGrid');
            gridApi = agGrid.createGrid(gridDiv, gridOptions);
    
            async function loadClientData() {
                gridApi.showLoadingOverlay();
            
                try {
                    const response = await fetch(`/api/browse/${currentTable}`);
                    const result   = await response.json();
                    
                    if (result.error) {
                        gridApi.hideOverlay();
                        showErrorModal(result.error);
                        return;
                    }
            
                    const currentCols = gridApi.getColumnDefs() || [];
                    if (result.data.length > 0 && currentCols.length === 0) {
                        const keys = Object.keys(result.data[0]); 
                        const emptyCols = getEmptyColumns(result.data);
                        
                        // --- NEW: Find the first key that isn't hvp_id so we can pin it ---
                        const firstVisibleKey = keys.find(k => k !== 'hvp_id');
                        
                        const colDefs = keys.map(k => ({ 
                            field: k, 
                            headerName: k,
                            // --- UPDATED: Always hide hvp_id, otherwise respect empty column toggle ---
                            hide: k === 'hvp_id' ? true : (hideEmptyColumns && emptyCols.includes(k)),
                            // --- NEW: Pin the first non-hvp_id column to the left ---
                            pinned: k === firstVisibleKey ? 'left' : null
                        }));
                        
                        gridApi.setGridOption('columnDefs', colDefs);
                    
                        setTimeout(() => {
                            const allColumnIds = gridApi.getColumns().map(col => col.getColId());
                            gridApi.autoSizeColumns(allColumnIds);
                        }, 50);
                    } else if (result.data.length === 0 && currentCols.length === 0) {
                        gridApi.setGridOption('columnDefs', []);
                    }
            
                    gridApi.setGridOption('rowData', result.data);
            
                    gridApi.hideOverlay();
                    updateActionBar();
            
                } catch (err) {
                    gridApi.hideOverlay();
                    showErrorModal(`Network Error: ${err.message}`);
                }
            }
    
            function updateActionBar() {
                actionBar.innerHTML = ''; 
                const actions = ACTION_CONFIG[currentTable] || [];
                
                actions.forEach(action => {
                    const btn = document.createElement('button');
                    btn.className = 'ag-icon-btn';
                    btn.innerHTML = `<span class="material-symbols-outlined">${action.icon}</span> ${action.label}`;
                    
                    btn.addEventListener('click', async () => {
                        const selectedData = gridApi.getSelectedRows();
                        if (selectedData.length === 0) {
                            showErrorModal("Please select at least one row to perform this action.");
                            return;
                        }
    
                        const payloadData = selectedData.map(row => row[action.payloadKey]).filter(Boolean);
                        
                        if (payloadData.length === 0) {
                            showErrorModal(`None of the selected rows contain a valid '${action.payloadKey}'.`);
                            return;
                        }
    
                        try {
                            const response = await fetch(action.endpoint, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ items: payloadData })
                            });
                            
                            const data = await response.json();
                            if (!response.ok || data.error) {
                                showErrorModal(data.error || `Server Error: ${response.status}`);
                            } else {
                                gridApi.deselectAll();
                                loadClientData(); 
                            }
                        } catch (err) {
                            showErrorModal(`Network Error: ${err.message}`);
                        }
                    });
                    actionBar.appendChild(btn);
                });
    
                // --- NEW: Append the Toggle Empty Columns Button ---
                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'ag-icon-btn';
                
                // Helper to sync the icon and tooltip with the current state
                const updateToggleUI = () => {
                    toggleBtn.title = hideEmptyColumns ? "Show Empty Columns" : "Hide Empty Columns";
                    toggleBtn.innerHTML = `<span class="material-symbols-outlined">${hideEmptyColumns ? 'visibility' : 'visibility_off'}</span>`;
                };
                
                updateToggleUI(); // Set initial UI
    
                toggleBtn.addEventListener('click', () => {
                    hideEmptyColumns = !hideEmptyColumns;
                    updateToggleUI();
                    
                    // Extract current data to re-evaluate which columns are empty
                    const rowData = [];
                    gridApi.forEachNode(node => rowData.push(node.data));
                    
                    if (rowData.length > 0) {
                        const emptyCols = getEmptyColumns(rowData);
                        gridApi.setColumnsVisible(emptyCols, !hideEmptyColumns);
                    }
                });
                
                actionBar.appendChild(toggleBtn);
            }
    
            // --- Event Listeners ---
            searchInput.addEventListener('input', (e) => {
                gridApi.setGridOption('quickFilterText', e.target.value);
            });
    
            document.getElementById('refresh-btn').addEventListener('click', () => {
                loadClientData();
            });
    
            tabButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    currentTable = e.target.getAttribute('data-table');
                    
                    gridApi.setGridOption('columnDefs', []);
                    gridApi.setGridOption('rowData', []);
                    gridApi.setGridOption('quickFilterText', '');
                    searchInput.value = ''; 
                    
                    loadClientData();
                });
            });
    
            // Initialize Grid
            loadClientData();
        });
        
        
        
        // --- Custom Footer Logic ---
        const pageSizeSelect = document.getElementById('page-size-select');
        const btnPrevPage = document.getElementById('btn-prev-page');
        const btnNextPage = document.getElementById('btn-next-page');
        
        // Handle Page Size Change
        pageSizeSelect.addEventListener('change', (e) => {
            gridApi.setGridOption('paginationPageSize', Number(e.target.value));
        });
        
        // Handle Pagination Buttons
        btnPrevPage.addEventListener('click', () => gridApi.paginationGoToPreviousPage());
        btnNextPage.addEventListener('click', () => gridApi.paginationGoToNextPage());
        
        // Main Update Function
        function updateCustomFooter() {
            if (!gridApi) return;
        
            // 1. Pagination Details
            const currentPage = gridApi.paginationGetCurrentPage() + 1;
            const totalPages = gridApi.paginationGetTotalPages() || 1;
            document.getElementById('stat-page-info').textContent = `Page ${currentPage} of ${totalPages}`;
            
            // Disable/Enable buttons based on page
            btnPrevPage.disabled = currentPage === 1;
            btnNextPage.disabled = currentPage === totalPages;
        
            // 2. Selection Details
            const selectedCount = gridApi.getSelectedRows().length;
            document.getElementById('stat-selected').textContent = `${selectedCount} Selected`;
        
            // 3. Filter & Total Details
            // getDisplayedRowCount() respects filters. 
            // gridApi.getGridOption('rowData').length gets the absolute total.
            const displayedCount = gridApi.getDisplayedRowCount();
            const rowData = gridApi.getGridOption('rowData');
            const absoluteTotal = rowData ? rowData.length : 0;
        
            document.getElementById('stat-total').textContent = `Total: ${displayedCount} rows`;
        
            const filteredEl = document.getElementById('stat-filtered');
            if (displayedCount < absoluteTotal) {
                filteredEl.textContent = `(Filtered from ${absoluteTotal} total)`;
                filteredEl.style.display = 'inline';
            } else {
                filteredEl.style.display = 'none';
            }
        }
    </script>
</body>
</html>
