<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VBR - Browse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link href="https://unpkg.com/tabulator-tables@6.4.0/dist/css/tabulator.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet"/>
</head>

<body>

    <!--#include virtual="/app/header.html" -->
  
    <main class="mpa-container">
        <div class="page-wrapper page-wrapper-full" style="display: flex; flex-direction: column; height: 100%;">
            
            <div class="section-header flex-row flex-between" style="align-items: center; margin-bottom: 1rem;">
                
                <div class="flex-row" style="align-items: center; gap: 0.5rem;" id="dynamic-action-bar">
                    </div>
                
                <div class="flex-row" style="align-items: center; gap: 0.75rem;">
                    <div class="input-group">
                        <select id="page-size-selector" class="form-control" style="width: auto; padding-right: 1rem; cursor: pointer;">
                            <option value="auto">Auto-fit View</option>
                            <option value="100">100 Rows</option>
                            <option value="500">500 Rows</option>
                            <option value="1000">1000 Rows</option>
                            <option value="5000">5000 Rows</option>
                        </select>
                    </div>
                    <button id="refresh-btn" class="btn btn-secondary" title="Refresh Data">
                        <span class="material-symbols-outlined">refresh</span>
                    </button>
                </div>
            </div>

            <div class="workspace-layout" style="flex-grow: 1; display: flex; flex-direction: column; min-height: 0;">
                <div id="data-table" style="flex-grow: 1; width: 100%; min-height: 0;"></div>
                
                <div class="excel-tabs" id="excel-tabs">
                    <button class="tab-btn active" data-table="participants">participants</button>
                    <button class="tab-btn" data-table="events">events</button>
                    <button class="tab-btn" data-table="samples">samples</button>
                    <button class="tab-btn" data-table="libraries">libraries</button>
                    <button class="tab-btn" data-table="analyses">analyses</button>
                    <button class="tab-btn" data-table="files">files</button>
                    <button class="tab-btn" data-table="biosamples">biosamples</button>
                    <button class="tab-btn" data-table="sra">sra</button>
                </div>
            </div>
            
        </div>
    </main>

    <!--#include virtual="/app/footer.html" -->
  
    <div id="error-modal" class="modal-overlay">
        <div class="card modal-content">
            <div class="card-body">
                <div class="flex-row" style="color: var(--error); margin-bottom: 1rem; gap: 0.5rem;">
                    <span class="material-symbols-outlined" style="font-size: 2rem;">error</span>
                    <h3 style="margin: 0; font-size: 1.25rem;">Action Error</h3>
                </div>
                <p id="error-message" style="margin-bottom: 1.5rem; color: var(--text-muted);"></p>
                <div style="text-align: right;">
                    <button class="btn btn-secondary" onclick="closeErrorModal()">Dismiss</button>
                </div>
            </div>
        </div>
    </div>
  
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.4.0/dist/js/tabulator.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
        
        const refreshBtn = document.getElementById('refresh-btn');
        const pageSizeSelector = document.getElementById('page-size-selector');
        const tabButtons = document.querySelectorAll('.tab-btn');
        const dataTableContainer = document.getElementById('data-table');
        const excelTabs = document.getElementById('excel-tabs');
        const actionBar = document.getElementById('dynamic-action-bar');
        
        let currentTable   = "participants";
        let refreshClicked = "false";
    
        // --- Configuration for Tab-Specific Actions ---
        const ACTION_CONFIG = {
            "biosamples": [
                {
                    id: "btn-assign-biosample",
                    label: "Assign BioSample IDs",
                    icon: "assignment",
                    endpoint: "/api/biosamples/assign",
                    payloadKey: "sample_name"
                }
            ],
            "sra": [
                {
                    id: "btn-export-sra",
                    label: "Export for SRA",
                    icon: "ios_share",
                    endpoint: "/api/sra/export",
                    payloadKey: "file_path"
                }
            ]
        };
    
        // Modal Handlers
        window.showErrorModal = function(msg) {
            document.getElementById('error-message').textContent = msg;
            document.getElementById('error-modal').classList.add('show');
        };
        window.closeErrorModal = function() {
            document.getElementById('error-modal').classList.remove('show');
        };
    
        function calculatePageSize() {
            if (pageSizeSelector.value !== "auto") {
                return parseInt(pageSizeSelector.value, 10);
            }
            const containerHeight = dataTableContainer.clientHeight;
            const nonRowHeight = 135; 
            const availableHeight = containerHeight - nonRowHeight;
            const rowHeight = 32; 
            let size = Math.floor(availableHeight / rowHeight);
            return size > 0 ? size : 1;
        }
    
        // ==========================================
        // EXTERNAL SELECTION CONTROLLER
        // ==========================================
        const selectedRowsMap = new Map(); // Stores id -> full row data
        let lastToggledId = null;          // Anchor for shift-click
        let lastToggledState = true;       // Tracks if anchor was selected or deselected
    
        function clearSelectionState() {
            selectedRowsMap.clear();
            lastToggledId = null;
        }
        // ==========================================
        
        const table = new Tabulator("#data-table", {
            layout: "fitData", 
            autoColumns: true, 
            // selectableRows: true is INTENTIONALLY REMOVED. 
        
            dataReceive: function(data) {
                const idMap = {
                    "participants": "participant_uid",
                    "events": "event_uid",
                    "samples": "sample_uid",
                    "libraries": "library_uid",
                    "analyses": "analysis_uid",
                    "files": "file_uniq_name",
                    "biosamples": "sample_name",
                    "sra": "file_path"
                };
                const idField = idMap[currentTable];
                data.forEach(row => { row.id = row[idField]; });
                return data;
            },
        
            autoColumnsDefinitions: function(definitions) {
                definitions = definitions.filter(col => col.field !== "id");
        
                definitions.unshift({
                    field: "custom_select",
                    title: "",
                    headerSort: false,
                    hozAlign: "center",
                    frozen: true,
                    width: 50,
                    formatter: function(cell) {
                        const rowData = cell.getData();
                        // Check our external map to see if this row should be checked
                        const isChecked = selectedRowsMap.has(rowData.id);
                        return `<input type="checkbox" ${isChecked ? "checked" : ""} style="pointer-events: none;">`;
                    }
                });
        
                definitions.forEach((column) => {
                    if (column.field !== "custom_select") {
                        column.headerFilter = "input";
                    }
                });
                
                return definitions;
            },
    
            // rowFormatter handles applying the correct background color to rows natively
            // as they are scrolled into view or paginated.
            rowFormatter: function(row) {
                const data = row.getData();
                if (!data || !data.id) return;
    
                const el = row.getElement();
                if (selectedRowsMap.has(data.id)) {
                    el.classList.add("tabulator-selected"); // Reuse Tabulator's native highlight class
                } else {
                    el.classList.remove("tabulator-selected");
                }
            },
        
            rowClick: function(e, row) {
                const currentData = row.getData();
                const currentId = currentData.id;
                const currentTableRef = row.getTable();
    
                if (e.shiftKey && lastToggledId !== null) {
                    // Clear native text highlighting caused by shift-clicking
                    if (window.getSelection) window.getSelection().removeAllRanges();
    
                    const activeRows = currentTableRef.getRows("active"); 
                    
                    const startIndex = activeRows.findIndex(r => r.getData().id === lastToggledId);
                    const endIndex = activeRows.findIndex(r => r.getData().id === currentId);
    
                    if (startIndex > -1 && endIndex > -1) {
                        const min = Math.min(startIndex, endIndex);
                        const max = Math.max(startIndex, endIndex);
    
                        // Apply the state of the anchor to all rows in the range (Gmail style)
                        for (let i = min; i <= max; i++) {
                            const targetData = activeRows[i].getData();
                            if (lastToggledState) {
                                selectedRowsMap.set(targetData.id, targetData);
                            } else {
                                selectedRowsMap.delete(targetData.id);
                            }
                        }
                    }
                } else {
                    // Standard Click - Toggle State
                    if (selectedRowsMap.has(currentId)) {
                        selectedRowsMap.delete(currentId);
                        lastToggledState = false;
                    } else {
                        selectedRowsMap.set(currentId, currentData);
                        lastToggledState = true;
                    }
                    lastToggledId = currentId;
                }
    
                // Force visible rows to rebuild cells and trigger rowFormatter.
                // This instantly repaints checkboxes and background colors.
                currentTableRef.getRows("active").forEach(r => r.reformat());
            },
        
            ajaxURL: "/api/browse",
            ajaxConfig: "POST", 
            ajaxContentType: "json",
            
            ajaxParams: function() {
                const params = { table: currentTable, refresh: refreshClicked };
                refreshClicked = "false";
                return params;
            },
        
            pagination: true,
            paginationMode: "remote",
            paginationSize: calculatePageSize(), 
            sortMode: "remote",
            filterMode: "remote", 
            placeholder: "No data available in this table",
        });
    
        // Re-mount the hanging Excel-tabs to the footer
        table.on("tableBuilt", function() {
            const footer = dataTableContainer.querySelector('.tabulator-footer');
            if(footer) {
                footer.insertBefore(excelTabs, footer.firstChild);
            }
            updateActionBar(currentTable);
        });
    
        // Action Bar Generator
        function updateActionBar(tableName) {
            actionBar.innerHTML = ''; 
            
            const actions = ACTION_CONFIG[tableName] || [];
            
            actions.forEach(action => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-primary';
                btn.id = action.id;
                btn.innerHTML = `<span class="material-symbols-outlined">${action.icon}</span> ${action.label}`;
                
                btn.addEventListener('click', async () => {
                    // Pull data from our external Map, NOT Tabulator's native selection
                    const selectedRows = Array.from(selectedRowsMap.values());
                    
                    if (selectedRows.length === 0) {
                        showErrorModal("Please select at least one row to perform this action.");
                        return;
                    }
    
                    const payloadData = selectedRows
                        .map(row => row[action.payloadKey])
                        .filter(val => val !== undefined && val !== null && val !== "");
                    
                    if (payloadData.length === 0) {
                        showErrorModal(`None of the selected rows contain a valid '${action.payloadKey}'.`);
                        return;
                    }
    
                    try {
                        const response = await fetch(action.endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ items: payloadData })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok && data.error) {
                            showErrorModal(data.error);
                        } else if (!response.ok) {
                            showErrorModal(`Server Error: ${response.status} ${response.statusText}`);
                        } else {
                            // Success - Clear selection map, force refresh
                            clearSelectionState();
                            refreshClicked = "true";
                            table.setData();
                        }
                    } catch (err) {
                        showErrorModal(`Network Error: ${err.message}`);
                    }
                });
                
                actionBar.appendChild(btn);
            });
        }
    
        // Tab Switching functionality
        tabButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                tabButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                currentTable = e.target.getAttribute('data-table');
                
                // Clear selections when changing datasets
                clearSelectionState();
                
                table.clearData();
                table.setData();
                updateActionBar(currentTable);
            });
        });
    
        // Handle standard refresh
        refreshBtn.addEventListener('click', () => {
            // Optionally, call clearSelectionState() here if you want refresh to clear selections.
            refreshClicked = "true";
            table.setData();
        });
    
        // Handle Page Size manual override
        pageSizeSelector.addEventListener('change', () => {
            const newSize = calculatePageSize();
            table.setPageSize(newSize);
        });
    
        // Throttled viewport resizing
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
    
        window.addEventListener('resize', debounce(() => {
            if (dataTableContainer.clientHeight > 0 && pageSizeSelector.value === "auto") { 
                const newSize = calculatePageSize();
                if (table.getPageSize() !== newSize) {
                    table.setPageSize(newSize);
                }
            }
        }, 200));
        
    });
    </script>
</body>
</html>
