<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VBR - Browse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet"/>

    <style>
        /* --- Softer, High-Legibility Tabulator Theme --- */
        .tabulator { 
            background-color: var(--surface); 
            border: 1px solid var(--border-color); 
            border-radius: 0.5rem;
            color: #f1f5f9; /* Brighter, crisper text for readability */ 
            font-family: var(--font-main); 
        }
        
        .tabulator-header { 
            background-color: var(--surface-high); 
            border-bottom: 2px solid var(--border-color); 
            color: var(--text-muted); 
            font-size: 0.75rem; /* Slightly larger header text */
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            font-weight: 700; 
        }
        
        .tabulator-header .tabulator-col { 
            background-color: var(--surface-high) !important; 
            border-right: 1px solid var(--border-color); 
        }
        
        .tabulator-header .tabulator-col-content { 
            padding: 0.875rem 1rem; /* More breathing room */
        }
        
        .tabulator-row { 
            background-color: var(--surface); 
            border-bottom: 1px solid var(--border-color); 
            font-size: 0.875rem; /* Bumped up font size from 0.8125rem */
            transition: background-color 0.2s ease; 
        }
        
        /* Replaced the dark alternating row with a very faint, soft highlight */
        .tabulator-row.tabulator-row-even { 
            background-color: rgba(255, 255, 255, 0.02); 
        }
        
        /* Softer, color-tinted hover state */
        .tabulator-row:hover { 
            background-color: rgba(137, 206, 255, 0.08); 
        }
        
        .tabulator-cell { 
            padding: 0.875rem 1rem; 
            border-right: 1px solid var(--border-color); 
        }
        
        .tabulator-footer { 
            background-color: var(--surface-high); 
            border-top: 1px solid var(--border-color); 
            color: var(--text-main); 
            padding: 0.75rem 1rem;
        }
        
        .tabulator-footer .tabulator-page { 
            border: 1px solid var(--border-color); 
            background: var(--surface); 
            color: var(--text-main); 
            border-radius: 0.25rem; 
            margin: 0 0.25rem;
            padding: 0.375rem 0.75rem;
            transition: all 0.2s;
        }
        
        .tabulator-footer .tabulator-page:hover { 
            background: var(--primary-container); 
            color: var(--on-primary-container); 
            border-color: var(--primary-container);
        }
        
        .tabulator-footer .tabulator-page.active { 
            background: var(--primary); 
            color: var(--bg-main); 
            border-color: var(--primary); 
        }
        
        /* Themed Scrollbars for the table */
        .tabulator-tableholder::-webkit-scrollbar { width: 8px; height: 8px; }
        .tabulator-tableholder::-webkit-scrollbar-track { background: var(--surface); }
        .tabulator-tableholder::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .tabulator-tableholder::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>

<body>
  
    <!--#include virtual="/app/header.html" -->
    
    <main class="mpa-container">
        <div class="page-wrapper page-wrapper-full">
            
            <div class="section-header">
                <span class="material-symbols-outlined">table_view</span>
                <h2>Database Browser</h2>
            </div>
            
            <div class="card card-body mb-3 flex-row flex-between" style="padding: 1rem; background-color: var(--surface-high);">
                
                <div class="flex-row">
                    <span class="material-symbols-outlined text-muted">database</span>
                    <div class="input-group" style="width: 200px;">
                        <select id="table-selector" class="form-control" style="cursor: pointer;">
                            <option value="analyses">Analyses</option>
                            <option value="biosamples">Biosamples</option>
                            <option value="events">Events</option>
                            <option value="files">Files</option>
                            <option value="libraries">Libraries</option>
                            <option value="participants">Participants</option>
                            <option value="samples">Samples</option>
                            <option value="sra">SRA</option>
                        </select>
                    </div>
                    <button id="refresh-btn" class="btn btn-secondary">
                        <span class="material-symbols-outlined">refresh</span>
                    </button>
                </div>
            
                <div class="flex-row">
                    <div class="input-group" style="width: 200px;">
                        <select id="filter-field" class="form-control" style="cursor: pointer;">
                            <option value="">Select column...</option>
                            </select>
                    </div>
                    <div class="input-group" style="width: 250px;">
                        <span class="material-symbols-outlined input-icon-left">search</span>
                        <input id="filter-value" class="form-control" placeholder="Search..." type="text"/>
                        <span id="filter-clear" class="material-symbols-outlined input-icon-right" style="display: none;">close</span>
                    </div>
                </div>
            </div>

            <div class="workspace-layout">
                <div id="data-table" style="width: 100%; height: 100%; min-height: 0;"></div>
            </div>
            
        </div>
    </main>
  
    <!--#include virtual="/app/footer.html" -->
    
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
          
            const tableSelector = document.getElementById('table-selector');
            const refreshBtn    = document.getElementById('refresh-btn');
            const filterField   = document.getElementById('filter-field');
            const filterValue   = document.getElementById('filter-value');
            const filterClear   = document.getElementById('filter-clear');

            // Initialize Tabulator
            const table = new Tabulator("#data-table", {
                layout: "fitData", // Ensures wide tables scroll horizontally rather than squishing
                autoColumns: true, // Automatically generate columns from the JSON keys
                
                // --- Remote Data Configuration ---
                ajaxURL: "/api/browse",
                ajaxConfig: "POST", // POST is very clean in Tabulator
                ajaxContentType: "json",
                
                // Dynamic parameters: Always pass the currently selected table
                ajaxParams: function() {
                    return { table: tableSelector.value };
                },

                // --- Pagination & Sorting ---
                pagination: true,
                paginationMode: "remote",
                paginationSize: 50,
                sortMode: "remote",
                filterMode: "remote",
                
                // Fallback text
                placeholder: "No data available in this table",
            });

            // Reload data when the user changes the selected table
            tableSelector.addEventListener('change', () => {
                // Clear existing columns so autoColumns can recalculate for the new table
                table.clearData();
                table.setData();
            });

            // Manual refresh
            refreshBtn.addEventListener('click', () => {
                table.setData();
            });
            
            // Apply Filter Function
            function applyFilter() {
                const field = filterField.value;
                const value = filterValue.value;
                
                if (field && value) {
                    // Sends {"field": field, "type": "like", "value": value} to your R backend
                    table.setFilter(field, "like", value);
                    filterClear.style.display = 'block';
                } else {
                    table.clearFilter();
                    filterClear.style.display = 'none';
                }
            }
            
            // Listeners for Filter Inputs
            filterValue.addEventListener('input', applyFilter); // Triggers as they type
            filterField.addEventListener('change', applyFilter);
            
            // Clear Button Logic
            filterClear.addEventListener('click', () => {
                filterValue.value = '';
                applyFilter();
            });
            
            // Dynamically populate the column dropdown when data loads
            table.on("dataLoaded", function(data) {
                // Only populate if the dropdown is empty (just the default option)
                if (filterField.options.length <= 1 && data.length > 0) {
                    const columns = table.getColumns();
                    
                    columns.forEach(col => {
                        const def = col.getDefinition();
                        const opt = document.createElement('option');
                        opt.value = def.field;
                        opt.textContent = def.field; // Using the raw field name as the label
                        filterField.appendChild(opt);
                    });
                }
            });
            
            // Update your existing tableSelector listener to clear the filter state
            tableSelector.addEventListener('change', () => {
                // Reset filter UI
                filterValue.value = '';
                filterField.innerHTML = '<option value="">Select column...</option>';
                filterClear.style.display = 'none';
                
                table.clearData();
                table.setData();
            });
            
        });
    </script>
</body>
</html>
