<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VBR - Browse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link href="style.css" rel="stylesheet"/>
</head>

<body>

    <!--#include virtual="/app/header.html" -->

    <main class="mpa-container">
        <div class="page-wrapper page-wrapper-full" style="display: flex; flex-direction: column; height: 100%;">
            
            <div class="excel-tabs top-tabs" id="excel-tabs" style="margin-bottom: 0;">
                <button class="tab-btn" data-table="biosamples">biosamples</button>
                <button class="tab-btn" data-table="sra">sra</button>
                <div class="vertical-divider"></div>
                <button class="tab-btn active" data-table="participants">participants</button>
                <button class="tab-btn" data-table="events">events</button>
                <button class="tab-btn" data-table="samples">samples</button>
                <button class="tab-btn" data-table="libraries">libraries</button>
                <button class="tab-btn" data-table="analyses">analyses</button>
                <button class="tab-btn" data-table="files">files</button>
            </div>
    
            <div class="workspace-layout ag-integrated-wrapper">
    
                <div class="ag-custom-toolbar flex-between">
                    
                    <div class="filter-wrapper">
                        <span class="material-symbols-outlined filter-icon">filter_list</span>
                        <input type="text" id="quick-filter-input" placeholder="Filter..." class="ag-custom-input" />
                    </div>
                    
                    <div class="flex-row" style="align-items: center; gap: 0.5rem;">
                        <div id="dynamic-action-bar" class="flex-row" style="gap: 0.5rem;"></div>
                        <button id="refresh-btn" class="ag-icon-btn" title="Refresh Data">
                            <span class="material-symbols-outlined">refresh</span>
                        </button>
                    </div>
                </div>
            
                <div id="myGrid" style="flex-grow: 1; width: 100%;"></div>

                <div class="ag-custom-footer flex-between">
                    
                    <div class="footer-section footer-left">
                        <label for="page-size-select">Page Size:</label>
                        <select id="page-size-select" class="ag-custom-input ag-custom-footer-select">
                            <option value="20">20</option>
                            <option value="50">50</option>
                            <option value="100" selected>100</option>
                            <option value="500">500</option>
                        </select>
                    </div>

                    <div class="footer-section footer-center">
                        <span id="stat-selected" class="stat-selected">0 Selected</span>
                        <span id="stat-total">Total: 0 rows</span>
                        <span id="stat-filtered" class="stat-filtered">(Filtered from 0)</span>
                    </div>

                    <div class="footer-section footer-right">
                        <button id="btn-first-page" class="ag-icon-btn" title="First Page">
                            <span class="material-symbols-outlined">keyboard_double_arrow_left</span>
                        </button>
                        <button id="btn-prev-page" class="ag-icon-btn" title="Previous Page">
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <span id="stat-page-info">Page 1 of 1</span>
                        <button id="btn-next-page" class="ag-icon-btn" title="Next Page">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </button>
                        <button id="btn-last-page" class="ag-icon-btn" title="Last Page">
                            <span class="material-symbols-outlined">keyboard_double_arrow_right</span>
                        </button>
                    </div>
                </div>
                
            </div>
            
        </div>
    </main>

    <!--#include virtual="/app/footer.html" -->
  
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@35.3.1/dist/ag-grid-community.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabButtons  = document.querySelectorAll('.tab-btn');
            const actionBar   = document.getElementById('dynamic-action-bar');
            const searchInput = document.getElementById('quick-filter-input');
            
            // Custom Footer Elements
            const pageSizeSelect = document.getElementById('page-size-select');
            const btnFirstPage   = document.getElementById('btn-first-page');
            const btnPrevPage    = document.getElementById('btn-prev-page');
            const btnNextPage    = document.getElementById('btn-next-page');
            const btnLastPage    = document.getElementById('btn-last-page');
            
            let currentTable = "participants";
            let gridApi;
            let hideEmptyColumns = true; 
    
            function getEmptyColumns(data) {
                if (!data || data.length === 0) return [];
                const keys = Object.keys(data[0]);
                return keys.filter(key => 
                    data.every(row => row[key] === null || row[key] === undefined || row[key] === '')
                );
            }
    
            window.showErrorModal = msg => {
                document.getElementById('error-message').textContent = msg;
                document.getElementById('error-modal').classList.add('show');
            };
            window.closeErrorModal = () => document.getElementById('error-modal').classList.remove('show');
    
            const ACTION_CONFIG = {
                "biosamples": [{ id: "btn-assign-biosample", label: "Assign BioSample IDs", icon: "assignment", endpoint: "/api/biosamples/assign" }],
                "sra": [{ id: "btn-export-sra", label: "Export for SRA", icon: "ios_share", endpoint: "/api/sra/export" }]
            };
    
            const gridOptions = {
                theme: agGrid.themeQuartz.withPart(agGrid.colorSchemeDarkBlue),
                pagination: true,
                paginationPageSize: 100,
                paginationPageSizeSelector: [20, 50, 100, 500, 1000, 5000],
                columnDefs: [],
                suppressPaginationPanel: true,
                alwaysShowHorizontalScroll: true,
                alwaysShowVerticalScroll: true,
                onPaginationChanged: updateCustomFooter,
                onSelectionChanged: updateCustomFooter,
                onModelUpdated: updateCustomFooter,
                
                selectionColumnDef: {
                    width: 50,
                    minWidth: 50,
                    maxWidth: 50,
                    pinned: 'left',
                    resizable: false,
                    suppressSizeToFit: true
                },
                
                defaultColDef: {
                    sortable: true,
                    filter: true,
                    resizable: true,
                    minWidth: 120,
                    tooltipValueGetter: (params) => params.value 
                },
                
                getRowId: params => {
                    if (!params.data) return undefined;
                    return params.data.hvp_id;
                }
            };
    
            const gridDiv = document.querySelector('#myGrid');
            gridApi = agGrid.createGrid(gridDiv, gridOptions);
    
            async function loadClientData() {
          
                gridApi.setGridOption('loading', true);
                updateRowSelection();
            
                try {
                    const response = await fetch(`/api/browse/${currentTable}`);
                    
                    // NEW: Handle 401 Unauthorized
                    if (response.status === 401) {
                        gridApi.setGridOption('loading', false);
                        showErrorModal('Your session has expired. Please reload the page to continue.');
                        return;
                    }
    
                    const result   = await response.json();
                    
                    if (result.error) {
                        gridApi.setGridOption('loading', false);
                        showErrorModal(result.error);
                        return;
                    }
            
                    const currentCols = gridApi.getColumnDefs() || [];
                    if (result.data.length > 0 && currentCols.length === 0) {
                        const keys = Object.keys(result.data[0]); 
                        const emptyCols = getEmptyColumns(result.data); 
                        
                        const firstVisibleKey = keys.find(k => k !== 'hvp_id');
                        
                        const colDefs = keys.map(k => ({ 
                            field: k, 
                            headerName: k,
                            hide: k === 'hvp_id' ? true : (hideEmptyColumns && emptyCols.includes(k)),
                            pinned: k === firstVisibleKey ? 'left' : null
                        }));
                        
                        gridApi.setGridOption('columnDefs', colDefs);
                    
                        setTimeout(() => {
                            const allColumnIds = gridApi.getColumns().map(col => col.getColId());
                            gridApi.autoSizeColumns(allColumnIds);
                        }, 50);
                    } else if (result.data.length === 0 && currentCols.length === 0) {
                        gridApi.setGridOption('columnDefs', []);
                    }
            
                    gridApi.setGridOption('rowData', result.data);
            
                    gridApi.setGridOption('loading', false);
                    updateActionBar();
            
                } catch (err) {
                    gridApi.setGridOption('loading', false);
                    showErrorModal(`Network Error: ${err.message}`);
                }
            }
    
            function updateCustomFooter() {
                if (!gridApi) return;
            
                // 1. Pagination Details
                const currentPage = gridApi.paginationGetCurrentPage() + 1;
                const totalPages = gridApi.paginationGetTotalPages() || 1;
                document.getElementById('stat-page-info').textContent = `Page ${currentPage} of ${totalPages}`;
                
                btnFirstPage.disabled = currentPage === 1;
                btnPrevPage.disabled  = currentPage === 1;
                btnNextPage.disabled  = currentPage === totalPages;
                btnLastPage.disabled  = currentPage === totalPages;
            
                // 2. Selection Details
                const selectedCount = gridApi.getSelectedRows().length;
                const selectedEl = document.getElementById('stat-selected');
                if (selectedCount > 0) {
                    selectedEl.textContent = `${selectedCount} Selected`;
                    selectedEl.style.display = 'inline';
                } else {
                    selectedEl.style.display = 'none';
                }
            
                // 3. Filter & Total Details
                const displayedCount = gridApi.getDisplayedRowCount();
                const rowData = gridApi.getGridOption('rowData');
                const absoluteTotal = rowData ? rowData.length : 0;
            
                document.getElementById('stat-total').textContent = `Total: ${absoluteTotal} rows`;
            
                const filteredEl = document.getElementById('stat-filtered');
                if (displayedCount < absoluteTotal) {
                    filteredEl.textContent = `(Filtered to ${displayedCount})`;
                    filteredEl.style.display = 'inline';
                } else {
                    filteredEl.style.display = 'none';
                }
            }
            
            
            // --- Handle selection state independently ---
            function updateRowSelection() {
              
                const actions    = ACTION_CONFIG[currentTable] || [];
                const hasActions = actions.length > 0;
                
                gridApi.setGridOption('rowSelection', hasActions ? {
                    mode: 'multiRow',
                    headerCheckbox: true,
                    checkboxes: true,
                    enableClickSelection: true,
                    isRowSelectable: rowNode => {
                      // Guard clause in case data isn't fully attached yet
                      if (!rowNode.data) return false;
                      
                      if (currentTable === 'biosamples') {
                          const acc = rowNode.data.biosample_accession;
                          return acc === null || acc === undefined || String(acc).trim() === '';
                      }
                      return true; 
                  }
                } : undefined);
            }

            function updateActionBar() {
              
                actionBar.innerHTML = ''; 
                const actions = ACTION_CONFIG[currentTable] || [];
                
                actions.forEach(action => {
                    const btn = document.createElement('button');
                    btn.className = 'ag-icon-btn action-btn';
                    btn.disabled = true; 
                    btn.style.opacity = '0.5'; 
                    
                    btn.innerHTML = `<span class="material-symbols-outlined action-icon">${action.icon}</span> <span class="action-label">${action.label}</span>`;
                    
                    const selectionListener = () => {
                        const hasSelection = gridApi.getSelectedRows().length > 0;
                        btn.disabled = !hasSelection;
                        btn.style.opacity = hasSelection ? '1' : '0.5';
                    };
                    gridApi.addEventListener('selectionChanged', selectionListener);
                    
                    btn.addEventListener('click', async () => {
                        const selectedData = gridApi.getSelectedRows();
                        const payloadData = selectedData.map(row => row.hvp_id).filter(Boolean);
                        
                        const iconSpan = btn.querySelector('.action-icon');
                        const originalIcon = iconSpan.textContent;
                        iconSpan.textContent = 'sync'; 
                        iconSpan.style.animation = 'spin 1s linear infinite'; 
                        btn.disabled = true;
                        btn.style.opacity = '0.5';
            
                        try {
                            const response = await fetch(action.endpoint, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ hvp_ids: payloadData })
                            });
                            
                            // NEW: Handle 401 Unauthorized
                            if (response.status === 401) {
                                showErrorModal('Your session has expired. Please reload the page to continue.');
                                return; // Exit before trying to parse JSON
                            }
                            
                            const data = await response.json();
                            if (!response.ok || data.error) {
                                showErrorModal(data.error || `Server Error: ${response.status}`);
                            } else {
                                gridApi.deselectAll(); 
                                await loadClientData(); 
                            }
                        } catch (err) {
                            showErrorModal(`Network Error: ${err.message}`);
                        } finally {
                            iconSpan.textContent = originalIcon;
                            iconSpan.style.animation = 'none';
                            selectionListener(); 
                        }
                    });
                    
                    actionBar.appendChild(btn);
                });
            
                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'ag-icon-btn';
                
                const updateToggleUI = () => {
                    toggleBtn.title     = hideEmptyColumns ? "Show Empty Columns" : "Hide Empty Columns";
                    toggleBtn.innerHTML = `<span class="material-symbols-outlined">${hideEmptyColumns ? 'visibility' : 'visibility_off'}</span>`;
                };
                
                updateToggleUI(); 
            
                toggleBtn.addEventListener('click', () => {
                    hideEmptyColumns = !hideEmptyColumns;
                    updateToggleUI();
                    
                    const rowData = [];
                    gridApi.forEachNode(node => rowData.push(node.data));
                    
                    if (rowData.length > 0) {
                        const emptyCols = getEmptyColumns(rowData);
                        gridApi.setColumnsVisible(emptyCols, !hideEmptyColumns);
                    }
                });
                
                actionBar.appendChild(toggleBtn);
            }
    
            // --- Event Listeners ---
            searchInput.addEventListener('input', (e) => {
                gridApi.setGridOption('quickFilterText', e.target.value);
            });
    
            document.getElementById('refresh-btn').addEventListener('click', () => {
                gridApi.deselectAll();
                loadClientData();
            });

            // Pagination Listeners
            pageSizeSelect.addEventListener('change', e => gridApi.setGridOption('paginationPageSize', Number(e.target.value)));
            btnFirstPage.addEventListener('click', () => gridApi.paginationGoToFirstPage());
            btnPrevPage.addEventListener('click', () => gridApi.paginationGoToPreviousPage());
            btnNextPage.addEventListener('click', () => gridApi.paginationGoToNextPage());
            btnLastPage.addEventListener('click', () => gridApi.paginationGoToLastPage());
    
            tabButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    currentTable = e.target.getAttribute('data-table');
                    
                    gridApi.setGridOption('columnDefs', []);
                    gridApi.setGridOption('rowData', []);
                    gridApi.setGridOption('quickFilterText', '');
                    searchInput.value = ''; 
                    
                    loadClientData();
                });
            });
    
            // Initialize Grid
            loadClientData();
        });
    </script>
</body>
</html>
