<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VBR - Browse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet"/>

    <style>
        /* --- Softer, High-Legibility Tabulator Theme --- */
        .tabulator { 
            background-color: var(--surface); 
            border: 1px solid var(--border-color); 
            border-bottom: none; /* Removed bottom border to blend with tabs */
            border-radius: 0.5rem 0.5rem 0 0;
            color: #f1f5f9; 
            font-family: var(--font-main); 
        }
        
        .tabulator-header { 
            background-color: var(--surface-high); 
            border-bottom: 2px solid var(--border-color); 
            color: var(--text-muted); 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            font-weight: 700; 
        }
        
        .tabulator-header .tabulator-col { 
            background-color: var(--surface-high) !important; 
            border-right: 1px solid var(--border-color); 
        }
        
        .tabulator-header .tabulator-col-content { 
            padding: 0.875rem 1rem; 
        }

        /* Styling for the auto-generated header filters */
        .tabulator-header-filter input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.375rem 0.5rem;
            background-color: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 0.25rem;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.75rem;
        }
        .tabulator-header-filter input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .tabulator-row { 
            background-color: var(--surface); 
            border-bottom: 1px solid var(--border-color); 
            font-size: 0.875rem; 
            transition: background-color 0.2s ease; 
        }
        
        .tabulator-row.tabulator-row-even { 
            background-color: rgba(255, 255, 255, 0.02); 
        }
        
        .tabulator-row:hover { 
            background-color: rgba(137, 206, 255, 0.08); 
        }
        
        .tabulator-cell { 
            padding: 0.875rem 1rem; 
            border-right: 1px solid var(--border-color); 
        }
        
        .tabulator-footer { 
            background-color: var(--surface-high); 
            border-top: 1px solid var(--border-color); 
            color: var(--text-main); 
            padding: 0.75rem 1rem;
        }
        
        .tabulator-footer .tabulator-page { 
            border: 1px solid var(--border-color); 
            background: var(--surface); 
            color: var(--text-main); 
            border-radius: 0.25rem; 
            margin: 0 0.25rem;
            padding: 0.375rem 0.75rem;
            transition: all 0.2s;
        }
        
        .tabulator-footer .tabulator-page:hover { 
            background: var(--primary-container); 
            color: var(--on-primary-container); 
            border-color: var(--primary-container);
        }
        
        .tabulator-footer .tabulator-page.active { 
            background: var(--primary); 
            color: var(--bg-main); 
            border-color: var(--primary); 
        }
        
        /* Themed Scrollbars for the table */
        .tabulator-tableholder::-webkit-scrollbar { width: 8px; height: 8px; }
        .tabulator-tableholder::-webkit-scrollbar-track { background: var(--surface); }
        .tabulator-tableholder::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .tabulator-tableholder::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* --- Excel-like Bottom Tabs --- */
        .excel-tabs {
            display: flex;
            background-color: var(--surface-high);
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 0.5rem 0.5rem;
            padding: 0.25rem 0.5rem 0 0.5rem;
            overflow-x: auto;
        }

        .tab-btn {
            background-color: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            padding: 0.5rem 1.25rem;
            margin-right: 0.25rem;
            cursor: pointer;
            color: var(--text-muted);
            border-radius: 0.375rem 0.375rem 0 0;
            font-family: var(--font-main);
            font-size: 0.8125rem;
            font-weight: 500;
            text-transform: capitalize;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .tab-btn.active {
            background-color: var(--surface);
            border-color: var(--border-color);
            color: var(--primary);
            font-weight: 600;
            position: relative;
        }
        
        /* Small overlap to seamlessly blend the active tab with the element above it */
        .tab-btn.active::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background-color: var(--surface);
        }
    </style>
</head>

<body>
  
    <!--#include virtual="/app/header.html" -->
  
    <main class="mpa-container">
        <div class="page-wrapper page-wrapper-full" style="display: flex; flex-direction: column; height: 100%;">
            
            <div class="section-header flex-row flex-between" style="align-items: center; margin-bottom: 1rem;">
                <div class="flex-row" style="align-items: center; gap: 0.5rem;">
                    <span class="material-symbols-outlined">table_view</span>
                    <h2 style="margin: 0;">Database Browser</h2>
                </div>
                <button id="refresh-btn" class="btn btn-secondary" title="Refresh Data">
                    <span class="material-symbols-outlined">refresh</span>
                </button>
            </div>

            <div class="workspace-layout" style="flex-grow: 1; display: flex; flex-direction: column; min-height: 0;">
                <div id="data-table" style="flex-grow: 1; width: 100%; min-height: 0;"></div>
                
                <div class="excel-tabs">
                    <button class="tab-btn active" data-table="participants">participants</button>
                    <button class="tab-btn" data-table="events">events</button>
                    <button class="tab-btn" data-table="samples">samples</button>
                    <button class="tab-btn" data-table="libraries">libraries</button>
                    <button class="tab-btn" data-table="analyses">analyses</button>
                    <button class="tab-btn" data-table="files">files</button>
                </div>
            </div>
            
        </div>
    </main>
  
    <!--#include virtual="/app/footer.html" -->
  
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
          
            const refreshBtn = document.getElementById('refresh-btn');
            const tabButtons = document.querySelectorAll('.tab-btn');
            const dataTableContainer = document.getElementById('data-table');
            
            // State variable for the currently active table
            let currentTable = "participants";

            // --- Dynamic Pagination Calculation ---
            // Calculates how many rows can fit in the visible table container height
            function calculatePageSize() {
                const containerHeight = dataTableContainer.clientHeight;
                
                // Approximate heights in pixels: 
                // Header (with filters) ~ 75px, Footer ~ 45px
                const nonRowHeight = 120; 
                const availableHeight = containerHeight - nonRowHeight;
                
                // Approximate row height ~ 42px
                const rowHeight = 42; 
                
                let size = Math.floor(availableHeight / rowHeight);
                return size > 0 ? size : 1; // Ensure at least 1 row is requested
            }

            // Initialize Tabulator
            const table = new Tabulator("#data-table", {
                layout: "fitData", 
                autoColumns: true, 
                
                // Automatically inject an input filter into every column header
                autoColumnsDefinitions: function(definitions) {
                    definitions.forEach((column) => {
                        column.headerFilter = "input";
                    });
                    return definitions;
                },
                
                ajaxURL: "/api/browse",
                ajaxConfig: "POST", 
                ajaxContentType: "json",
                
                // Always pass the currently selected tab
                ajaxParams: function() {
                    return { table: currentTable };
                },

                pagination: true,
                paginationMode: "remote",
                paginationSize: calculatePageSize(), // Initial size calculation
                sortMode: "remote",
                filterMode: "remote", // Tabulator automatically sends the header filter data remotely
                
                placeholder: "No data available in this table",
            });

            // Handle Tab Clicks
            tabButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Update active styling
                    tabButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    // Update current state and fetch new data
                    currentTable = e.target.getAttribute('data-table');
                    
                    // Clear existing columns/data and recalculate 
                    table.clearData();
                    table.setData();
                });
            });

            // Manual refresh
            refreshBtn.addEventListener('click', () => {
                table.setData();
            });

            // --- Handle Window Resizing for Dynamic Rows ---
            // Debounce function to prevent constant recalculation during window drag
            function debounce(func, wait) {
                let timeout;
                return function(...args) {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), wait);
                };
            }

            // Listen for window resize, recalculate page size, and update Tabulator if changed
            window.addEventListener('resize', debounce(() => {
                if (containerHeightCheck() > 0) { // Check if container is actually visible
                    const newSize = calculatePageSize();
                    if (table.getPageSize() !== newSize) {
                        table.setPageSize(newSize);
                    }
                }
            }, 200));

            // Helper to prevent errors if the tab is hidden
            function containerHeightCheck() {
                return dataTableContainer.clientHeight;
            }
            
        });
    </script>
</body>
</html>
