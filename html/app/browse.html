<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VBR - Browse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@35.3.0/styles/ag-grid.css">
    <link href="style.css" rel="stylesheet"/>
</head>

<body>

    <!--#include virtual="/app/header.html" -->

    <main class="mpa-container">
        <div class="page-wrapper page-wrapper-full" style="display: flex; flex-direction: column; height: 100%;">
            
            <div class="excel-tabs top-tabs flex-between" id="excel-tabs" style="margin-bottom: 0;">
                <div class="flex-row" style="gap: 0;">
                    <button class="tab-btn active" data-table="participants">participants</button>
                    <button class="tab-btn" data-table="events">events</button>
                    <button class="tab-btn" data-table="samples">samples</button>
                    <button class="tab-btn" data-table="libraries">libraries</button>
                    <button class="tab-btn" data-table="analyses">analyses</button>
                    <button class="tab-btn" data-table="files">files</button>
                </div>
                
                <div class="flex-row" style="gap: 0;">
                    <button class="tab-btn" data-table="biosamples">biosamples</button>
                    <button class="tab-btn" data-table="sra">sra</button>
                </div>
            </div>
    
            <div class="workspace-layout ag-integrated-wrapper">
                <div id="myGrid" class="ag-theme-quartz-dark" style="flex-grow: 1; width: 100%;"></div>
            </div>
            
        </div>
    </main>

    <!--#include virtual="/app/footer.html" -->

    <div id="error-modal" class="modal-overlay">
        <div class="card modal-content">
            <div class="card-body">
                <div class="flex-row" style="color: var(--error); margin-bottom: 1rem; gap: 0.5rem;">
                    <span class="material-symbols-outlined" style="font-size: 2rem;">error</span>
                    <h3 style="margin: 0; font-size: 1.25rem;">Action Error</h3>
                </div>
                <p id="error-message" style="margin-bottom: 1.5rem; color: var(--text-muted);"></p>
                <div style="text-align: right;">
                    <button class="btn btn-secondary" onclick="closeErrorModal()">Dismiss</button>
                </div>
            </div>
        </div>
    </div>
  
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@35.3.0/dist/ag-grid-community.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabButtons = document.querySelectorAll('.tab-btn');
            
            let currentTable = "participants";
            let gridApi;
            let currentSearchValue = ""; // State is now managed globally to sync with infinite scroll fetching

            window.showErrorModal = msg => {
                document.getElementById('error-message').textContent = msg;
                document.getElementById('error-modal').classList.add('show');
            };
            window.closeErrorModal = () => document.getElementById('error-modal').classList.remove('show');

            const ACTION_CONFIG = {
                "biosamples": [{ id: "btn-assign-biosample", label: "Assign BioSample IDs", icon: "assignment", endpoint: "/api/biosamples/assign", payloadKey: "sample_name" }],
                "sra": [{ id: "btn-export-sra", label: "Export for SRA", icon: "ios_share", endpoint: "/api/sra/export", payloadKey: "file_path" }]
            };

            const ID_MAP = {
                "participants": "participant_uid", "events": "event_uid", "samples": "sample_uid",
                "libraries": "library_uid", "analyses": "analysis_uid", "files": "file_uniq_name",
                "biosamples": "sample_name", "sra": "file_path"
            };

            // --- 1. Custom Quick Access Toolbar Components ---

            // A) Filter Component
            class CustomFilterToolbarComp {
                init(params) {
                    this.eGui = document.createElement('div');
                    this.eGui.className = 'filter-wrapper';
                    this.eGui.innerHTML = `
                        <span class="material-symbols-outlined filter-icon">filter_list</span>
                        <input type="text" id="quick-filter-input" placeholder="Filter..." class="ag-custom-input" value="${currentSearchValue}" />
                    `;
                    
                    const input = this.eGui.querySelector('input');
                    let typingTimer;
                    input.addEventListener('input', () => {
                        currentSearchValue = input.value;
                        clearTimeout(typingTimer);
                        typingTimer = setTimeout(() => {
                            if (params.onSearch) params.onSearch();
                        }, 500);
                    });
                }

                refresh(params) {
                    // Returning true signals the grid to keep this component alive natively during redraws, preserving input focus
                    return true; 
                }

                getGui() {
                    return this.eGui;
                }
            }

            // B) Dynamic Action Buttons Component
            class CustomActionsToolbarComp {
                init(params) {
                    this.params = params;
                    this.eGui = document.createElement('div');
                    this.eGui.className = 'flex-row';
                    this.eGui.style.gap = '0.5rem';
                    this.eGui.style.alignItems = 'center';
                    this.renderActions();
                }

                refresh(params) {
                    this.params = params; // Catch updated params (like switching from 'biosamples' to 'sra')
                    this.renderActions();
                    return true;
                }

                getGui() {
                    return this.eGui;
                }
                
                renderActions() {
                    this.eGui.innerHTML = '';
                    const { currentTable, ACTION_CONFIG, refreshData, api } = this.params;
                    const actions = ACTION_CONFIG[currentTable] || [];
                    
                    // Render Contextual Actions
                    actions.forEach(action => {
                        const btn = document.createElement('button');
                        btn.className = 'ag-icon-btn';
                        btn.innerHTML = `<span class="material-symbols-outlined">${action.icon}</span> ${action.label}`;
                        
                        btn.addEventListener('click', async () => {
                            const selectedData = api.getSelectedRows();
                            if (selectedData.length === 0) {
                                showErrorModal("Please select at least one row to perform this action.");
                                return;
                            }

                            const payloadData = selectedData.map(row => row[action.payloadKey]).filter(Boolean);
                            if (payloadData.length === 0) {
                                showErrorModal(`None of the selected rows contain a valid '${action.payloadKey}'.`);
                                return;
                            }

                            try {
                                const response = await fetch(action.endpoint, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ items: payloadData })
                                });
                                
                                const data = await response.json();
                                if (!response.ok || data.error) {
                                    showErrorModal(data.error || `Server Error: ${response.status}`);
                                } else {
                                    api.deselectAll();
                                    refreshData(); 
                                }
                            } catch (err) {
                                showErrorModal(`Network Error: ${err.message}`);
                            }
                        });
                        this.eGui.appendChild(btn);
                    });

                    // Dynamic styling: Only draw a separator wall if action buttons are actively present
                    if (actions.length > 0) {
                        const divider = document.createElement('div');
                        divider.className = 'vertical-divider';
                        this.eGui.appendChild(divider);
                    }

                    // Render Standard Global Refresh Button
                    const refreshBtn = document.createElement('button');
                    refreshBtn.className = 'ag-icon-btn';
                    refreshBtn.title = 'Refresh Data';
                    refreshBtn.innerHTML = `<span class="material-symbols-outlined">refresh</span>`;
                    refreshBtn.addEventListener('click', () => refreshData());
                    
                    this.eGui.appendChild(refreshBtn);
                }
            }

            // --- 2. Toolbar Configuration Factory ---

            // Maps custom components and passes params safely
            const getToolbarConfig = (tableName) => {
                return {
                    items: [
                        {
                            toolbarItem: 'customFilterComp',
                            toolbarItemParams: { onSearch: setServerDataSource }
                        },
                        {
                            toolbarItem: 'customActionsComp',
                            alignment: 'right', // Push controls cleanly to the far right
                            toolbarItemParams: {
                                currentTable: tableName,
                                ACTION_CONFIG: ACTION_CONFIG,
                                refreshData: setServerDataSource
                            }
                        }
                    ]
                };
            };

            // --- 3. Grid Initialization ---

            const gridOptions = {
                rowModelType: 'infinite',
                pagination: true,
                paginationPageSize: 100,
                paginationPageSizeSelector: [100, 500, 1000, 5000],
                cacheBlockSize: 100,
                columnDefs: [],
                rowSelection: 'multiple',
                rowMultiSelectWithClick: true,
                
                // Map the Custom Component classes 
                components: {
                    customFilterComp: CustomFilterToolbarComp,
                    customActionsComp: CustomActionsToolbarComp
                },
                // Trigger the initial Toolbar View
                toolbar: getToolbarConfig(currentTable),
                
                defaultColDef: {
                    sortable: true,
                    resizable: true,
                    flex: 1,
                    minWidth: 120,
                    tooltipValueGetter: (params) => params.value 
                },
                getRowId: params => {
                    if (!params.data) return undefined;
                    return params.data[ID_MAP[currentTable]];
                }
            };

            const gridDiv = document.querySelector('#myGrid');
            gridApi = agGrid.createGrid(gridDiv, gridOptions);

            // --- 4. Core DataSource Loop ---

            function setServerDataSource() {
                const dataSource = {
                    getRows: async (params) => {
                        gridApi.showLoadingOverlay();

                        const page = Math.floor(params.startRow / gridApi.paginationGetPageSize()) + 1;
                        const size = params.endRow - params.startRow;

                        const sortObj = {};
                        if (params.sortModel && params.sortModel.length > 0) {
                            params.sortModel.forEach(s => { sortObj[s.colId] = s.sort; });
                        }

                        const payload = {
                            table:  currentTable,
                            page:   page,
                            size:   size,
                            filter: currentSearchValue.trim(), // Relies on component state instead of a rigid DOM query
                            sort:   sortObj
                        };

                        try {
                            const response = await fetch('/api/browse', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                            
                            const result = await response.json();
                            
                            if (result.error) {
                                gridApi.hideOverlay();
                                showErrorModal(result.error);
                                params.failCallback();
                                return;
                            }

                            if (result.data.length > 0 && gridApi.getColumnDefs().length === 0) {
                                const keys = Object.keys(result.data[0]).filter(k => k !== ID_MAP[currentTable]);
                                const colDefs = [{
                                    checkboxSelection: true, 
                                    pinned: 'left', 
                                    sortable: false, 
                                    flex: 0,
                                    width: 50, 
                                    minWidth: 50, 
                                    maxWidth: 50,
                                    resizable: false,
                                    suppressSizeToFit: true 
                                }];
                                keys.forEach(k => colDefs.push({ field: k, headerName: k }));
                                gridApi.setGridOption('columnDefs', colDefs);
                            }

                            gridApi.hideOverlay();
                            params.successCallback(result.data, result.total_rows);

                        } catch (err) {
                            gridApi.hideOverlay();
                            showErrorModal(`Network Error: ${err.message}`);
                            params.failCallback();
                        }
                    }
                };

                gridApi.setGridOption('datasource', dataSource);
            }

            // --- 5. Tab Listeners ---

            tabButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    currentTable = e.target.getAttribute('data-table');
                    
                    // Natively destroy existing columns
                    gridApi.setGridOption('columnDefs', []);
                    
                    // Clear component memory state and clear structural DOM filter instance
                    currentSearchValue = ''; 
                    const input = document.getElementById('quick-filter-input');
                    if (input) input.value = '';
                    
                    // Re-draw toolbar with new actions parameters via native grid updates
                    gridApi.setGridOption('toolbar', getToolbarConfig(currentTable));
                    
                    setServerDataSource();
                });
            });

            // Init Grid Loop
            setServerDataSource();
        });
    </script>
</body>
</html>
