<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VBR - Browse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet"/>

    <style>
        /* --- Dark Theme Tabulator Overrides --- */
        /* Using !important to aggressively override tabulator.min.css light defaults */
        .tabulator { 
            background-color: var(--surface) !important; 
            border: 1px solid var(--border-color) !important; 
            border-bottom: none !important; 
            border-radius: 0.5rem 0.5rem 0 0;
            color: #ffffff !important; /* Pure white text for max contrast */
            font-family: var(--font-main); 
        }
        
        .tabulator-header { 
            background-color: var(--surface-high) !important; 
            border-bottom: 2px solid var(--border-color) !important; 
            color: var(--text-muted) !important; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            font-weight: 700; 
        }
        
        .tabulator-header .tabulator-col { 
            background-color: var(--surface-high) !important; 
            border-right: 1px solid var(--border-color) !important; 
        }
        
        .tabulator-header .tabulator-col-content { 
            padding: 0.875rem 1rem !important; 
        }

        .tabulator-header-filter input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.375rem 0.5rem;
            background-color: var(--surface) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 0.25rem;
            color: #ffffff !important;
            font-family: var(--font-main);
            font-size: 0.75rem;
        }
        
        .tabulator-header-filter input:focus {
            outline: none;
            border-color: var(--primary) !important;
        }
        
        .tabulator-row { 
            background-color: var(--surface) !important; 
            border-bottom: 1px solid var(--border-color) !important; 
            font-size: 0.875rem; 
            transition: background-color 0.2s ease; 
        }
        
        .tabulator-row.tabulator-row-even { 
            background-color: rgba(255, 255, 255, 0.03) !important; 
        }
        
        .tabulator-row:hover { 
            background-color: rgba(137, 206, 255, 0.08) !important; 
        }
        
        .tabulator-cell { 
            padding: 0.875rem 1rem !important; 
            border-right: 1px solid var(--border-color) !important; 
        }
        
        /* Unified Footer holding both Tabs and Pagination */
        .tabulator-footer { 
            background-color: var(--surface-high) !important; 
            border-top: 1px solid var(--border-color) !important; 
            color: var(--text-main) !important; 
            padding: 0 0 0.75rem 0 !important; 
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Prevent Tabulator's internal sub-containers from rendering default white backgrounds */
        .tabulator-footer .tabulator-calcs-holder,
        .tabulator-footer .tabulator-paginator {
            background-color: transparent !important;
            color: inherit !important;
        }

        /* Pagination Container */
        .tabulator-footer .tabulator-paginator {
            align-self: flex-start; 
            padding: 0.375rem 1rem 0 1rem !important; 
            font-family: var(--font-main);
            font-size: 0.8125rem;
            display: flex;
            align-items: center;
        }
        
        /* Tabulator spans/labels like "Page 1 of 5" */
        .tabulator-footer .tabulator-page-counter {
            color: var(--text-muted) !important;
        }
        
        /* Pagination Controls */
        .tabulator-footer .tabulator-page { 
            border: 1px solid transparent !important; 
            background: transparent !important; 
            color: var(--text-muted) !important; 
            border-radius: 0.375rem; 
            margin: 0 0.125rem;
            padding: 0.375rem 0.75rem;
            font-family: var(--font-main);
            font-size: 0.8125rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .tabulator-footer .tabulator-page:not(.disabled):hover { 
            background: rgba(255, 255, 255, 0.05) !important;
            color: #ffffff !important; 
            border-color: transparent !important;
        }
        
        .tabulator-footer .tabulator-page.active { 
            background: var(--surface) !important; 
            color: var(--primary) !important; 
            border-color: var(--border-color) !important; 
            font-weight: 600;
        }

        .tabulator-footer .tabulator-page:disabled,
        .tabulator-footer .tabulator-page.disabled {
            opacity: 0.4 !important;
            cursor: not-allowed !important;
            color: var(--text-muted) !important;
            border-color: transparent !important;
        }
        
        .tabulator-tableholder::-webkit-scrollbar { width: 8px; height: 8px; }
        .tabulator-tableholder::-webkit-scrollbar-track { background: var(--surface); }
        .tabulator-tableholder::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .tabulator-tableholder::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* --- Excel-like Tabs (Hanging from the footer) --- */
        .excel-tabs {
            display: flex;
            padding: 0 0.5rem;
            overflow-x: auto;
        }

        .tab-btn {
            background-color: transparent;
            border: 1px solid transparent;
            border-top: none; 
            padding: 0.5rem 1.25rem;
            margin-right: 0.25rem;
            cursor: pointer;
            color: var(--text-muted);
            border-radius: 0 0 0.375rem 0.375rem; 
            font-family: var(--font-main);
            font-size: 0.8125rem;
            font-weight: 500;
            text-transform: capitalize;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .tab-btn.active {
            background-color: var(--surface);
            border-color: var(--border-color);
            color: var(--primary);
            font-weight: 600;
            position: relative;
        }
        
        /* Overlap to seamlessly blend the active tab with the table body above it */
        .tab-btn.active::before {
            content: "";
            position: absolute;
            top: -1px; 
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--surface);
        }
    </style>
</head>

<body>
  
    <!--#include virtual="/app/header.html" -->
  
    <main class="mpa-container">
        <div class="page-wrapper page-wrapper-full" style="display: flex; flex-direction: column; height: 100%;">
            
            <div class="section-header flex-row flex-between" style="align-items: center; margin-bottom: 1rem;">
                <div class="flex-row" style="align-items: center; gap: 0.5rem;">
                    <span class="material-symbols-outlined">table_view</span>
                    <h2 style="margin: 0;">Database Browser</h2>
                </div>
                <button id="refresh-btn" class="btn btn-secondary" title="Refresh Data">
                    <span class="material-symbols-outlined">refresh</span>
                </button>
            </div>

            <div class="workspace-layout" style="flex-grow: 1; display: flex; flex-direction: column; min-height: 0;">
                <div id="data-table" style="flex-grow: 1; width: 100%; min-height: 0;"></div>
                
                <div class="excel-tabs" id="excel-tabs">
                    <button class="tab-btn active" data-table="participants">participants</button>
                    <button class="tab-btn" data-table="events">events</button>
                    <button class="tab-btn" data-table="samples">samples</button>
                    <button class="tab-btn" data-table="libraries">libraries</button>
                    <button class="tab-btn" data-table="analyses">analyses</button>
                    <button class="tab-btn" data-table="files">files</button>
                </div>
            </div>
            
        </div>
    </main>
  
    <!--#include virtual="/app/footer.html" -->
  
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
          
            const refreshBtn = document.getElementById('refresh-btn');
            const tabButtons = document.querySelectorAll('.tab-btn');
            const dataTableContainer = document.getElementById('data-table');
            const excelTabs = document.getElementById('excel-tabs');
            
            let currentTable = "participants";

            function calculatePageSize() {
                const containerHeight = dataTableContainer.clientHeight;
                
                // Approximate heights: Header ~ 75px, Footer ~ 60px (adjusted for new padding)
                const nonRowHeight = 135; 
                const availableHeight = containerHeight - nonRowHeight;
                
                // Approximate row height ~ 42px
                const rowHeight = 42; 
                
                let size = Math.floor(availableHeight / rowHeight);
                return size > 0 ? size : 1;
            }

            const table = new Tabulator("#data-table", {
                layout: "fitData", 
                autoColumns: true, 
                
                autoColumnsDefinitions: function(definitions) {
                    definitions.forEach((column) => {
                        column.headerFilter = "input";
                    });
                    return definitions;
                },
                
                ajaxURL: "/api/browse",
                ajaxConfig: "POST", 
                ajaxContentType: "json",
                
                ajaxParams: function() {
                    return { table: currentTable };
                },

                pagination: true,
                paginationMode: "remote",
                paginationSize: calculatePageSize(), 
                sortMode: "remote",
                filterMode: "remote", 
                
                placeholder: "No data available in this table",
            });

            // Move the tabs into the table's footer once the table is built
            table.on("tableBuilt", function() {
                const footer = dataTableContainer.querySelector('.tabulator-footer');
                if(footer) {
                    // Prepend the tabs container so it sits on the left side
                    footer.insertBefore(excelTabs, footer.firstChild);
                }
            });

            // Handle Tab Clicks
            tabButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    currentTable = e.target.getAttribute('data-table');
                    
                    table.clearData();
                    table.setData();
                });
            });

            refreshBtn.addEventListener('click', () => {
                table.setData();
            });

            function debounce(func, wait) {
                let timeout;
                return function(...args) {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), wait);
                };
            }

            window.addEventListener('resize', debounce(() => {
                if (dataTableContainer.clientHeight > 0) { 
                    const newSize = calculatePageSize();
                    if (table.getPageSize() !== newSize) {
                        table.setPageSize(newSize);
                    }
                }
            }, 200));
            
        });
    </script>
</body>
</html>
