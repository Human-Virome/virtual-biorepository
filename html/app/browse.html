<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VBR - Browse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link href="https://unpkg.com/tabulator-tables@6.4.0/dist/css/tabulator.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet"/>
</head>

<body>

    <!--#include virtual="/app/header.html" -->
  
    <main class="mpa-container">
        <div class="page-wrapper page-wrapper-full" style="display: flex; flex-direction: column; height: 100%;">
            
            <div class="section-header flex-row flex-between" style="align-items: center; margin-bottom: 1rem;">
                
                <div class="flex-row" style="align-items: center; gap: 0.5rem;" id="dynamic-action-bar">
                    </div>
                
                <div class="flex-row" style="align-items: center; gap: 0.75rem;">
                    <div class="input-group">
                        <select id="page-size-selector" class="form-control" style="width: auto; padding-right: 1rem; cursor: pointer;">
                            <option value="auto">Auto-fit View</option>
                            <option value="100">100 Rows</option>
                            <option value="500">500 Rows</option>
                            <option value="1000">1000 Rows</option>
                            <option value="5000">5000 Rows</option>
                        </select>
                    </div>
                    <button id="refresh-btn" class="btn btn-secondary" title="Refresh Data">
                        <span class="material-symbols-outlined">refresh</span>
                    </button>
                </div>
            </div>

            <div class="workspace-layout" style="flex-grow: 1; display: flex; flex-direction: column; min-height: 0;">
                <div id="data-table" style="flex-grow: 1; width: 100%; min-height: 0;"></div>
                
                <div class="excel-tabs" id="excel-tabs">
                    <button class="tab-btn active" data-table="participants">participants</button>
                    <button class="tab-btn" data-table="events">events</button>
                    <button class="tab-btn" data-table="samples">samples</button>
                    <button class="tab-btn" data-table="libraries">libraries</button>
                    <button class="tab-btn" data-table="analyses">analyses</button>
                    <button class="tab-btn" data-table="files">files</button>
                    <button class="tab-btn" data-table="biosamples">biosamples</button>
                    <button class="tab-btn" data-table="sra">sra</button>
                </div>
            </div>
            
        </div>
    </main>

    <!--#include virtual="/app/footer.html" -->
  
    <div id="error-modal" class="modal-overlay">
        <div class="card modal-content">
            <div class="card-body">
                <div class="flex-row" style="color: var(--error); margin-bottom: 1rem; gap: 0.5rem;">
                    <span class="material-symbols-outlined" style="font-size: 2rem;">error</span>
                    <h3 style="margin: 0; font-size: 1.25rem;">Action Error</h3>
                </div>
                <p id="error-message" style="margin-bottom: 1.5rem; color: var(--text-muted);"></p>
                <div style="text-align: right;">
                    <button class="btn btn-secondary" onclick="closeErrorModal()">Dismiss</button>
                </div>
            </div>
        </div>
    </div>
  
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.4.0/dist/js/tabulator.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
          
            const refreshBtn = document.getElementById('refresh-btn');
            const pageSizeSelector = document.getElementById('page-size-selector');
            const tabButtons = document.querySelectorAll('.tab-btn');
            const dataTableContainer = document.getElementById('data-table');
            const excelTabs = document.getElementById('excel-tabs');
            const actionBar = document.getElementById('dynamic-action-bar');
            
            let currentTable   = "participants";
            let refreshClicked = "false";

            // --- Configuration for Tab-Specific Actions ---
            const ACTION_CONFIG = {
                "biosamples": [
                    {
                        id: "btn-assign-biosample",
                        label: "Assign BioSample IDs",
                        icon: "assignment",
                        endpoint: "/api/biosamples/assign",
                        payloadKey: "sample_name"
                    }
                ],
                "sra": [
                    {
                        id: "btn-export-sra",
                        label: "Export for SRA",
                        icon: "ios_share",
                        endpoint: "/api/sra/export",
                        payloadKey: "file_path"
                    }
                ]
            };

            // Modal Handlers
            window.showErrorModal = function(msg) {
                document.getElementById('error-message').textContent = msg;
                document.getElementById('error-modal').classList.add('show');
            };
            window.closeErrorModal = function() {
                document.getElementById('error-modal').classList.remove('show');
            };

            function calculatePageSize() {
                if (pageSizeSelector.value !== "auto") {
                    return parseInt(pageSizeSelector.value, 10);
                }
                const containerHeight = dataTableContainer.clientHeight;
                const nonRowHeight = 135; 
                const availableHeight = containerHeight - nonRowHeight;
                const rowHeight = 32; // Adjusted for compact row CSS
                let size = Math.floor(availableHeight / rowHeight);
                return size > 0 ? size : 1;
            }

            const table = new Tabulator("#data-table", {
                layout: "fitData",
                autoColumns: true,
                selectableRows: true,
                selectableRowsRangeMode: "click",
                
                autoColumnsDefinitions: function(definitions) {
                    // Unshift the built-in selection column to the front
                    definitions.unshift({
                        formatter: "rowSelection",
                        titleFormatter: "rowSelection",
                        hozAlign: "center",
                        headerSort: false,
                        width: 50,
                        frozen: true
                    });
            
                    // Apply filters only to data columns
                    definitions.forEach((column) => {
                        if (column.formatter !== "rowSelection") {
                            column.headerFilter = "input";
                        }
                    });
                    
                    return definitions;
                },
                
                ajaxURL: "/api/browse",
                ajaxConfig: "POST", 
                ajaxContentType: "json",
                
                ajaxParams: function() {
                    const params = { table: currentTable, refresh: refreshClicked };
                    refreshClicked = "false";
                    return params;
                },
            
                pagination: true,
                paginationMode: "remote",
                paginationSize: calculatePageSize(), 
                sortMode: "remote",
                filterMode: "remote", 
                
                placeholder: "No data available in this table",
            });

            // Re-mount the hanging Excel-tabs to the footer
            table.on("tableBuilt", function() {
                const footer = dataTableContainer.querySelector('.tabulator-footer');
                if(footer) {
                    footer.insertBefore(excelTabs, footer.firstChild);
                }
                updateActionBar(currentTable);
            });

            // Action Bar Generator
            function updateActionBar(tableName) {
                actionBar.innerHTML = ''; // clear current actions
                
                const actions = ACTION_CONFIG[tableName] || [];
                
                actions.forEach(action => {
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-primary';
                    btn.id = action.id;
                    btn.innerHTML = `<span class="material-symbols-outlined">${action.icon}</span> ${action.label}`;
                    
                    btn.addEventListener('click', async () => {
                        const selectedRows = table.getSelectedData();
                        
                        if (selectedRows.length === 0) {
                            showErrorModal("Please select at least one row to perform this action.");
                            return;
                        }

                        // Extract data based on payloadKey (ignoring empty/undefined cells)
                        const payloadData = selectedRows
                            .map(row => row[action.payloadKey])
                            .filter(val => val !== undefined && val !== null && val !== "");
                        
                        if (payloadData.length === 0) {
                            showErrorModal(`None of the selected rows contain a valid '${action.payloadKey}'.`);
                            return;
                        }

                        try {
                            const response = await fetch(action.endpoint, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ items: payloadData }) // adjust body key as needed by your backend
                            });
                            
                            const data = await response.json();
                            
                            if (response.ok && data.error) {
                                // 200 OK but handled error exists in payload
                                showErrorModal(data.error);
                            } else if (!response.ok) {
                                // System/HTTP Error
                                showErrorModal(`Server Error: ${response.status} ${response.statusText}`);
                            } else {
                                // Success - Force a refresh to see the new states
                                refreshClicked = "true";
                                table.setData();
                            }
                        } catch (err) {
                            showErrorModal(`Network Error: ${err.message}`);
                        }
                    });
                    
                    actionBar.appendChild(btn);
                });
            }

            // Tab Switching functionality
            tabButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    currentTable = e.target.getAttribute('data-table');
                    
                    table.clearData();
                    table.setData();
                    updateActionBar(currentTable);
                });
            });

            // Handle standard refresh
            refreshBtn.addEventListener('click', () => {
                refreshClicked = "true";
                table.setData();
            });

            // Handle Page Size manual override
            pageSizeSelector.addEventListener('change', () => {
                const newSize = calculatePageSize();
                table.setPageSize(newSize);
            });

            // Throttled viewport resizing (only auto-updates if "auto" is selected)
            function debounce(func, wait) {
                let timeout;
                return function(...args) {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), wait);
                };
            }

            window.addEventListener('resize', debounce(() => {
                if (dataTableContainer.clientHeight > 0 && pageSizeSelector.value === "auto") { 
                    const newSize = calculatePageSize();
                    if (table.getPageSize() !== newSize) {
                        table.setPageSize(newSize);
                    }
                }
            }, 200));
            
        });
    </script>
</body>
</html>
