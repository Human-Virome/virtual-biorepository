<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VBR - Browse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link href="style.css" rel="stylesheet"/>
    <style>
        /* Specific enhancements for the headless TanStack implementation */
        .ts-filter-input { width: 100%; padding: 0.25rem 0.5rem; background: var(--surface); border: 1px solid var(--border-color); color: #fff; border-radius: 0.25rem; font-size: 0.75rem; margin-top: 0.5rem;}
        .ts-filter-input:focus { outline: none; border-color: var(--primary); }
        .row-selected td { background-color: #1e3a5f !important; }
        .data-table tbody tr { cursor: pointer; }
    </style>
</head>

<body>

    <!--#include virtual="/app/header.html" -->

    <main class="mpa-container">
        <div class="page-wrapper page-wrapper-full" style="display: flex; flex-direction: column; height: 100%;">
            
            <div class="section-header flex-row flex-between" style="align-items: center; margin-bottom: 1rem;">
                <div class="flex-row" style="align-items: center; gap: 0.5rem;" id="dynamic-action-bar"></div>
                
                <div class="flex-row" style="align-items: center; gap: 0.75rem;">
                    <div class="input-group">
                        <select id="page-size-selector" class="form-control" style="width: auto; padding-right: 1rem; cursor: pointer;">
                            <option value="auto">Auto-fit View</option>
                            <option value="100">100 Rows</option>
                            <option value="500">500 Rows</option>
                            <option value="1000">1000 Rows</option>
                            <option value="5000">5000 Rows</option>
                        </select>
                    </div>
                    <button id="refresh-btn" class="btn btn-secondary" title="Refresh Data">
                        <span class="material-symbols-outlined">refresh</span>
                    </button>
                </div>
            </div>

            <div class="workspace-layout" style="flex-grow: 1; display: flex; flex-direction: column; min-height: 0;">
                
                <div class="data-table-container" id="table-scroll-container" style="flex-grow: 1; overflow-y: auto;">
                    <table class="data-table" id="tanstack-table" style="width: 100%;">
                        <thead id="ts-thead"></thead>
                        <tbody id="ts-tbody"></tbody>
                    </table>
                </div>
                
                <div class="tabulator-footer" id="ts-footer" style="padding: 0.5rem; display: flex; justify-content: space-between; align-items: center;">
                    <div class="excel-tabs" id="excel-tabs">
                        <button class="tab-btn active" data-table="participants">participants</button>
                        <button class="tab-btn" data-table="events">events</button>
                        <button class="tab-btn" data-table="samples">samples</button>
                        <button class="tab-btn" data-table="libraries">libraries</button>
                        <button class="tab-btn" data-table="analyses">analyses</button>
                        <button class="tab-btn" data-table="files">files</button>
                        <button class="tab-btn" data-table="biosamples">biosamples</button>
                        <button class="tab-btn" data-table="sra">sra</button>
                    </div>
                    <div class="tabulator-paginator" id="ts-pagination" style="display: flex; align-items: center; gap: 0.5rem;">
                        <button id="ts-prev" class="tabulator-page" disabled>Prev</button>
                        <span id="ts-page-info" style="font-size: 0.8125rem;">Page 1</span>
                        <button id="ts-next" class="tabulator-page" disabled>Next</button>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <!--#include virtual="/app/footer.html" -->

    <div id="error-modal" class="modal-overlay">
        <div class="card modal-content">
            <div class="card-body">
                <div class="flex-row" style="color: var(--error); margin-bottom: 1rem; gap: 0.5rem;">
                    <span class="material-symbols-outlined" style="font-size: 2rem;">error</span>
                    <h3 style="margin: 0; font-size: 1.25rem;">Action Error</h3>
                </div>
                <p id="error-message" style="margin-bottom: 1.5rem; color: var(--text-muted);"></p>
                <div style="text-align: right;">
                    <button class="btn btn-secondary" onclick="closeErrorModal()">Dismiss</button>
                </div>
            </div>
        </div>
    </div>
  
    <script type="module">
        import {
            createTable,
            getCoreRowModel
        } from 'https://esm.sh/@tanstack/table-core@8.10.7';

        async function initializeMinimalTable() {
            // 1. Fetch a static chunk of Participants data
            const response = await fetch('/api/browse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    table: 'participants',
                    page: 1,
                    size: 100, 
                    sort: [],
                    filter: []
                })
            });
            
            const result = await response.json();
            const data = result.data || [];

            if (data.length === 0) {
                document.getElementById('ts-tbody').innerHTML = '<tr><td style="padding: 2rem;">No data found.</td></tr>';
                return;
            }

            // 2. Dynamically generate basic column definitions
            const columns = Object.keys(data[0]).map(key => ({
                accessorKey: key,
                header: key
            }));

            // 3. Create the bare-bones TanStack Table instance
            const table = createTable({
                data: data,
                columns: columns,
                getCoreRowModel: getCoreRowModel()
            });

            // 4. Render the Headers natively
            const thead = document.getElementById('ts-thead');
            thead.innerHTML = table.getHeaderGroups().map(headerGroup => `
                <tr>
                    ${headerGroup.headers.map(header => `
                        <th>${header.column.columnDef.header}</th>
                    `).join('')}
                </tr>
            `).join('');

            // 5. Render the Body natively
            const tbody = document.getElementById('ts-tbody');
            tbody.innerHTML = table.getRowModel().rows.map(row => `
                <tr>
                    ${row.getVisibleCells().map(cell => `
                        <td>${cell.getValue() || ''}</td>
                    `).join('')}
                </tr>
            `).join('');
        }

        // Boot the app
        initializeMinimalTable();
    </script>
</body>
</html>
