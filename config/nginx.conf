user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

events {
    worker_connections 1024;
    use epoll;
}

http {

    # --- RAM & Performance Optimizations ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    types_hash_max_size 2048;
    
    # --- Offload large uploads to disk to save RAM ---
    client_max_body_size 50M;
    client_body_buffer_size 128k; 
    client_body_temp_path /var/lib/nginx/body;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Security Tweaks ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/access.log;
    gzip on;

    upstream httpuv_pool {
        least_conn;
        server 127.0.0.1:8000 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:8001 max_fails=1 fail_timeout=5s;
        keepalive 2;
    }

    # --- HTTP Redirect Server ---
    server {
        listen 80;
        server_name metadata.human-virome.org;
        
        # Dedicated location for Certbot challenges
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
        }
    
        # Redirect everything else to HTTPS
        location / {
            return 302 https://$host$request_uri;
        }
    }

    # --- Main HTTPS Server ---
    server {
    
        listen 443 ssl; 
        http2 on;
        server_name metadata.human-virome.org;
        root /var/www/vbr/html;

        ssl_certificate     /etc/letsencrypt/live/metadata.human-virome.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/metadata.human-virome.org/privkey.pem;


        # --- PUBLIC LOCATIONS (Default Open) ---
        
        location = / {
            auth_request /oauth2/auth;
            
            # If logged out -> internally serve the landing page
            error_page 401 =200 /landing.html;
            
            # If logged in -> execution passes auth_request.
            # Use try_files to safely trigger the redirect in the content phase.
            try_files /dev/null @redirect_to_dashboard;
        }

        # Named location to handle the redirect for authenticated users
        location @redirect_to_dashboard {
            return 302 /app/dashboard.html;
        }

        # Explicitly make the landing page public to prevent auth loops
        location = /landing.html {
            root /var/www/vbr/html;
        }

        location /oauth2/ {
            proxy_pass       http://127.0.0.1:4180;
            proxy_set_header Host                    $host;
            proxy_set_header X-Real-IP               $remote_addr;
            # This line ensures OAuth2 Proxy knows where to redirect back to!
            proxy_set_header X-Auth-Request-Redirect $request_uri;
        }
        
        location = /oauth2/auth {
            proxy_pass       http://127.0.0.1:4180;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-Uri  $request_uri;
            proxy_set_header Content-Length   "";
            proxy_pass_request_body           off;
        }

        location = /webhook/git-deploy {
            access_log /var/www/vbr-update-trigger;
            return 200 "Deployment queued.\n";
        }


        # --- PROTECTED STATIC ASSETS ---
        
        # Secures all HTML, CSS, JS, etc. requested by authenticated users
        location /app/ {
            auth_request /oauth2/auth;
            
            # Catch unauthorized users and push them to the OAuth login flow
            error_page 401 = /oauth2/start?rd=$request_uri;

            # Extract the user's email for our SSI header injection
            auth_request_set $oauth_email $upstream_http_x_auth_request_email;

            # Enable SSI for multi-page header/footer includes
            ssi on;
        }

        
        # --- DEDICATED UPLOAD ENDPOINT ---
        location = /api/metadata_upload {
            auth_request /oauth2/auth;
            
            auth_request_set $oauth_email $upstream_http_x_auth_request_email;
            proxy_set_header X-OAuth-Email $oauth_email;
            
            # Force Nginx to save the request body to a temp file.
            # 'clean' = delete temp file when the request finishes.
            client_body_in_file_only clean;
            
            # Prevent Nginx from sending the actual file data to R.
            # Instead, pass the path of the Nginx temp file to R.
            proxy_pass_request_body off;
            proxy_set_header Content-Length 0;
            proxy_set_header X-File-Path $request_body_file;

            proxy_pass http://httpuv_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
        

        # --- OTHER PROTECTED APIs ---
        location /api/ {
            auth_request /oauth2/auth;
            
            auth_request_set $oauth_email $upstream_http_x_auth_request_email;
            proxy_set_header X-OAuth-Email $oauth_email;
        
            proxy_pass http://httpuv_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
