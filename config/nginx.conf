user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

events {
    worker_connections 1024;
    use epoll;
}

http {
    # --- RAM & Performance Optimizations ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    types_hash_max_size 2048;
    
    # Offload large uploads to disk to save RAM
    client_max_body_size 50M;
    client_body_buffer_size 128k; 
    client_body_temp_path /var/lib/nginx/body;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Security Tweaks ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/access.log;
    gzip on;

    upstream plumber_pool {
        least_conn;
        server 127.0.0.1:8000 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:8001 max_fails=1 fail_timeout=5s;
        keepalive 2;
    }

    # --- HTTP Redirect Server ---
    server {
        listen 80;
        server_name hvp.jplab.net;
        
        # Dedicated location for Certbot challenges
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot; # Or any dedicated path
        }
    
        # Redirect everything else to HTTPS
        location / {
            return 302 https://$host$request_uri;
        }
    }

    # --- Main HTTPS Server ---
    server {
        listen 443 ssl http2;
        server_name hvp.jplab.net;

        root /var/www/hvp/html;
        index index.html;

        ssl_certificate     /etc/letsencrypt/live/hvp.jplab.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hvp.jplab.net/privkey.pem;

        location / {
            try_files $uri $uri/ @plumber;
        }

        location @plumber {
            proxy_pass http://plumber_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_next_upstream error timeout http_502;
            proxy_next_upstream_tries 2;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
            
            proxy_request_buffering on;
            proxy_buffers 8 16k;
            proxy_buffer_size 16k;
        }
    }
}
