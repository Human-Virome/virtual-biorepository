# --- Globus Auth Configuration ---
provider        = "oidc"
oidc_issuer_url = "https://auth.globus.org"

# These are provided by /etc/oauth2-proxy.env
# client_id      = (Loaded from Env. From globus developer console.)
# client_secret  = (Loaded from Env. From globus developer console.)
# cookie_secret  = (Loaded from Env. Create with `openssl rand -base64 32`.)

# Globus specific scopes for identity and university info
scope             = "openid email profile"
oidc_groups_claim = "organization"

# Allow all domains, or restrict to specific consortium university domains (e.g., "uw.edu, wsu.edu")
email_domains = "*"

# Memory-optimized cookie storage (no Redis required for your 1GB RAM instance)
session_store_type = "cookie"
cookie_secure      = true
cookie_domains     = "hvp.jplab.net"
cookie_expire      = "12h"

# Run locally - Nginx will proxy to this
http_address = "127.0.0.1:4180"

# Dummy upstream since Nginx handles the actual application routing
upstreams = "file:///dev/null"

# Expose authentication headers (like Email and User) to Nginx
set_xauthrequest = true
